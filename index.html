<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prince Goyal · Setup Utility</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0000a8;--fg:#fff;--lab:#55ffff;--val:#ffff55;--bar:#aaa;--red:#ff5555;--grn:#55ff55}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:var(--fg);font:400 15px/1.5 'JetBrains Mono',monospace;overflow:hidden}
button{font:inherit;color:inherit}
a{color:var(--val)}
#post{position:fixed;inset:0;background:#000;padding:24px clamp(16px,4vw,48px);z-index:20;white-space:pre-wrap;color:#ddd;overflow:auto;cursor:pointer}
#post b{color:var(--grn);font-weight:400}
.cur{display:inline-block;width:.6em;height:1em;background:#ddd;vertical-align:-2px;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#bios{height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
#bios:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#0000001f 2px 3px)}
.title{background:var(--bar);color:#000;text-align:center;padding:2px 8px;font-weight:700}
.tabs{display:flex;overflow-x:auto;background:var(--bg);border-bottom:3px double var(--fg);scrollbar-width:none}
.tabs button{background:none;border:0;padding:4px clamp(14px,3vw,34px);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--lab);color:#000;font-weight:700}
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr minmax(240px,34%);gap:0;padding:12px clamp(8px,2vw,24px)}
.pane{border:3px double var(--fg);padding:10px 14px;overflow:auto;min-height:0}
.pane h2{margin:0 0 10px;font-size:15px;font-weight:700;color:var(--lab);text-align:center}
.row{display:flex;justify-content:space-between;gap:16px;padding:1px 8px;cursor:pointer}
.row .l{color:var(--lab)}.row .v{color:var(--val);text-align:right}
.row.sel{background:var(--bar)}.row.sel .l,.row.sel .v{color:#000}
.row.sel .v:before{content:"► "}
.help{margin-left:-3px;border-left-width:0}
.help p{margin:0 0 10px;color:var(--fg);font-family:'JetBrains Mono',monospace;font-size:14px}
.help .keys{margin-top:18px;border-top:1px solid #8888ff;padding-top:10px;color:#ccf;font-size:13px}
.leg{display:flex;flex-wrap:wrap;gap:4px 22px;justify-content:center;background:var(--bar);color:#000;padding:3px 8px;font-size:13px}
.leg button{background:none;border:0;color:#000;cursor:pointer;padding:0 2px}
.leg button:hover{background:#000;color:#fff}
.leg b{font-weight:700}
@media(max-width:760px){.main{grid-template-columns:1fr;grid-template-rows:auto auto;overflow:auto}.help{margin:0;border-left-width:3px;margin-top:8px}.row{flex-direction:column;gap:0;padding:4px 8px}.row .v{text-align:left}html,body{overflow:auto}}
#dlg{position:absolute;inset:0;display:none;place-items:center;z-index:10;background:#0008}
#dlg.show{display:grid}
#dlg div.box{background:var(--bar);color:#000;border:3px double #000;box-shadow:8px 8px 0 #000;padding:18px 28px;text-align:center;max-width:90vw}
#dlg .btns{display:flex;gap:24px;justify-content:center;margin-top:16px}
#dlg .btns button{background:none;border:0;cursor:pointer;padding:0 10px}
#dlg .btns button.on{background:#000;color:#fff}
:focus-visible{outline:2px solid var(--val);outline-offset:1px}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
</style>
</head>
<body>
<div id="post" role="status" aria-label="Boot sequence. Press any key to continue."></div>

<div id="bios" hidden>
 <div class="title">Prince Goyal Setup Utility - Copyright (C) 2026</div>
 <div class="tabs" id="tabs" role="tablist"></div>
 <div class="main">
  <div class="pane" id="list" role="listbox" tabindex="0" aria-label="Settings"></div>
  <div class="pane help"><h2>Item Specific Help</h2><div id="help" aria-live="polite"></div>
   <div class="keys">Tip: use the arrow keys, Enter opens links, Esc jumps to Exit.</div></div>
 </div>
 <div class="leg" id="leg">
  <button data-a="left"><b>←→</b> Select Screen</button><button data-a="up"><b>↑</b></button><button data-a="down"><b>↓</b> Select Item</button>
  <button data-a="enter"><b>Enter</b> Select</button><button data-a="esc"><b>Esc</b> Exit</button><button data-a="f10"><b>F10</b> Save &amp; Exit</button>
 </div>
 <div id="dlg"><div class="box"><div>Save configuration changes and exit now?</div><div class="btns"><button id="y" class="on">[ Yes ]</button><button id="n">[ No ]</button></div></div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const tabs=[
 {n:'Main',t:'System Information',items:[
  {l:'User',v:'prince goyal',h:'Primary user of this system.'},
  {l:'Role',v:'Full stack web dev | Systems Architect',h:'Engineers high-performance web solutions and deploys intelligent, multi-modal AI agents for custom software.'},
  {l:'Degree',v:'B.Tech ECE',h:'Bachelor of Technology in Electronics & Communication and Engineering.'},
  {l:'University',v:'IIIT Guwahati',h:'Indian Institute of Information Technology, Guwahati.'},
  {l:'Focus',v:'High-Performance Web & AI Agents',h:'Deploying intelligent, AI-powered system agents (Gemini API / NotebookLM) within high-performance web environments.'},
  {l:'Quote',v:'"Talk is cheap. Show me the code."',h:'""Debugging is twice as hard as writing the code in the first place. Therefore, if you write the code as cleverly as possible, you are, by definition, not smart enough to debug it." — Brian Kernighan"'},
  {l:'System Time',v:'',live:1,h:'Live system clock. Not user-adjustable.'}]},
 {n:'Skills',t:'Runtime Configuration',items:[
  {l:'PHP_8.x',v:'[Expert]',h:'Backend routing and request handling, written with strict types.'},
  {l:'MYSQL',v:'[Expert]',h:'Schema design and compound B-Tree indexing tuned to real query patterns.'},
  {l:'JS_ES6',v:'[Expert]',h:'Vanilla JavaScript with a solid model of the event loop. No framework weight.'},
  {l:'GEMINI_API',v:'[Advanced]',h:'AI agents built on the Gemini API, with structured outputs and tool use.'},
  {l:'Python',v:'[Intermediate]',h:'System automation and machine learning integrations, written for fast execution and data handling.'},
  {l:'C/C++',v:'[Intermediate]',h:'Core algorithms and competitive problem solving, focusing on raw execution speed and memory control.'}]},
 {n:'Boot',t:'Boot Priority (Projects)',items:[
  {l:'1st Boot Device',v:'Cinestream',href:'https://byprince.me/cinestream',h:'Immersive media sync platform for watching together.<br><br>byprince.me/cinestream'},
  {l:'2nd Boot Device',v:'Zenith Hub',href:'https://zenithhub.kesug.com',h:'JEE prep hub with a college predictor.<br><br>zenithhub.kesug.com'},
  {l:'3rd Boot Device',v:'DropQR',href:'https://byprince.me/dropqr',h:'Fast, self-expiring cross-device file transfer via QR.<br><br>byprince.me/dropqr'},
  {l:'4th Boot Device',v:'URL Shortener',href:'https://byprince.me/shortener',h:'High-speed root-level redirect engine with custom slugs.<br><br>byprince.me/shortener'},
  {l:'5th Boot Device',v:'ExamCraft',href:'https://zenithhub.kesug.com/examcraft/index.php',h:'Advanced assessment architect for building and running exams.<br><br>examcraft.byprince.me'},
  {l:'M.2 Device',v:'School Management Software',h:'Comprehensive administrative suite for institutional operations.'},
     {l:'M.2 Device',v:'Study Guard AI Elite',h:'Chrome MV3 extension that uses AI to block distractions.'}]},
 {n:'Monitor',t:'PCH_COMMAND (Restricted)',items:[
  {l:'Systems Command',v:'/admin',h:'Restricted. URL hit monitoring and bug triage across the sites.'},
  {l:'Broadcast Mailer',v:'/admin_mailer',h:'Restricted. HTML template testing for mass email.'},
  {l:'Access Level',v:'[Admin Only]',h:'These tools are private.'}]},
 {n:'Exit',t:'Contact & Exit',items:[
  {l:'Reddit',v:'u/Own-Significance9747',href:'https://reddit.com/user/Own-Significance9747',h:'Press Enter to open my Reddit profile.'},
  {l:'Ecosystem Handle',v:'@princegoyal',h:'Find me everywhere under this handle.'},
  {l:'Save Changes and Exit',v:'[F10]',act:'save',h:'Reboot the system. Replays the boot sequence.'}]}
];
let ti=0,ii=0,modal=false,yes=true;
function render(){
 $('tabs').innerHTML=tabs.map((t,i)=>`<button role="tab" data-t="${i}" class="${i==ti?'on':''}" aria-selected="${i==ti}">${t.n}</button>`).join('');
 const T=tabs[ti];
 $('list').innerHTML=`<h2>${T.t}</h2>`+T.items.map((it,i)=>`<div class="row ${i==ii?'sel':''}" data-i="${i}" role="option" aria-selected="${i==ii}"><span class="l">${it.l}</span><span class="v"${it.live?' id="clk"':''}>${it.v.replace(/&/g,'&amp;')}</span></div>`).join('');
 const it=T.items[ii];$('help').innerHTML=`<p>${it.h}</p>`;
 clock();
 const s=document.querySelector('.row.sel');s&&s.scrollIntoView({block:'nearest'});
}
function clock(){const c=$('clk');if(c)c.textContent=new Date().toLocaleTimeString('en-GB')}
setInterval(clock,1000);
function go(a){
 if(modal){
  if(a=='left'||a=='right'||a=='up'||a=='down'){yes=!yes;dlg()}
  else if(a=='esc'){modal=false;dlg()}
  else if(a=='enter'){modal=false;dlg();if(yes)reboot()}
  return;
 }
 const n=tabs[ti].items.length;
 if(a=='left')ti=(ti+tabs.length-1)%tabs.length,ii=0;
 else if(a=='right')ti=(ti+1)%tabs.length,ii=0;
 else if(a=='up')ii=(ii+n-1)%n;
 else if(a=='down')ii=(ii+1)%n;
 else if(a=='esc')ti=tabs.length-1,ii=0;
 else if(a=='f10'){modal=true;yes=true;dlg();return}
 else if(a=='enter'){const it=tabs[ti].items[ii];if(it.href)window.open(it.href,'_blank','noopener');else if(it.act=='save'){modal=true;yes=true;dlg();return}}
 render();
}
function dlg(){$('dlg').classList.toggle('show',modal);$('y').className=yes?'on':'';$('n').className=yes?'':'on'}
addEventListener('keydown',e=>{
 if(!$('post').hidden){skip();e.preventDefault();return}
 const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',Enter:'enter',Escape:'esc',F10:'f10'}[e.key];
 if(m){e.preventDefault();go(m)}
});
$('tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){ti=+b.dataset.t;ii=0;render()}};
$('list').onclick=e=>{const r=e.target.closest('[data-i]');if(r){const same=ii==+r.dataset.i;ii=+r.dataset.i;render();if(same)go('enter')}};
$('leg').onclick=e=>{const b=e.target.closest('[data-a]');if(b)go(b.dataset.a)};
$('y').onclick=()=>{yes=true;go('enter')};$('n').onclick=()=>{yes=false;go('enter')};
// POST sequence
const lines=[
 'Prince Goyal BIOS v1.0 (C) 2026 HW_REV_1.0',
 '',
 'CPU : Systems Architect, 4.20GHz',
 'Memory Test : PHP_8.x  MYSQL  JS  GEMINI_API  PYTHON   C/C++<b>OK</b>',
 '',
 'Detecting boot devices...',
 '  Cinestream  <b>OK</b>',
 '  Zenith Hub  <b>OK</b>',
 '  DropQr  <b>OK</b>',
 '  URL Shortener  <b>OK</b>',
 '  ExamCraft  <b>OK</b>',
 '  Study Guard AI Elite  <b>OK</b>',
 '',
 'Press <b>ANY KEY</b> to enter SETUP<span class="cur"></span>'
];
let timers=[];
function post(){
 const p=$('post');p.hidden=false;$('bios').hidden=true;p.innerHTML='';timers.forEach(clearTimeout);timers=[];
 if(matchMedia('(prefers-reduced-motion:reduce)').matches){p.innerHTML=lines.join('\n');timers.push(setTimeout(skip,1200));return}
 lines.forEach((l,i)=>timers.push(setTimeout(()=>{p.innerHTML=lines.slice(0,i+1).join('\n')},i*230)));
 timers.push(setTimeout(skip,lines.length*230+900));
}
function skip(){timers.forEach(clearTimeout);$('post').hidden=true;$('bios').hidden=false;render();$('list').focus({preventScroll:true})}
function reboot(){$('bios').hidden=true;ti=0;ii=0;post()}
$('post').onclick=skip;
post();
</script>
</body>
</html>
